<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#D4A373" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="地球Online" />
  <link rel="apple-touch-icon" href="./assets/icon-512-LpFM7Tda.png" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon-CZkzQ78X.svg" />
  <title>地球Online</title>
  <style>
    /* 内联启动屏：消除首访白屏闪烁（Vue 挂载后由 App.vue 移除）。配色对齐 Android：纸白 + 暖琥珀 */
    #eo-splash {
      position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: linear-gradient(160deg, #F8F6F2 0%, #EFE7DB 100%);
      color: #B08553; font-family: system-ui, -apple-system, sans-serif;
    }
    #eo-splash .logo { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(135deg, #E3BE97, #B08553);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; font-weight: 800;
      box-shadow: 0 18px 40px -14px rgba(154, 124, 88, .55), inset 0 1px 0 rgba(255,255,255,.4);
      animation: eo-pulse 1.6s ease-in-out infinite; }
    #eo-splash .name { font-size: 17px; font-weight: 700; letter-spacing: 2px; color: #1E1A16; }
    #eo-splash .bar { width: 132px; height: 5px; border-radius: 99px; background: rgba(176,133,83,.18); overflow: hidden; }
    #eo-splash .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #D4A373; animation: eo-slide 1.1s ease-in-out infinite; }
    @keyframes eo-pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes eo-slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }
  </style>
  <script type="module" crossorigin src="./assets/index-BewYBrv8.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B_jX6gyo.css">
<link rel="manifest" href="./manifest.webmanifest"></head>
<body>
  <div id="eo-splash" aria-hidden="true">
    <div class="logo">地</div>
    <div class="name">地球Online</div>
    <div class="bar"><i></i></div>
  </div>
  <div id="app"></div>
</body>
</html>
