<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 底板：暖琥珀对角渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DEC2"/>
      <stop offset=".48" stop-color="#D9A877"/>
      <stop offset="1" stop-color="#A2743D"/>
    </linearGradient>
    <radialGradient id="glow" cx=".26" cy=".18" r=".9">
      <stop offset="0" stop-color="#FFF8EC" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#FFF8EC" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFF8EC" stop-opacity="0"/>
    </radialGradient>
    <!-- 海洋：治愈系鼠尾草青，左上受光 -->
    <radialGradient id="sea" cx=".33" cy=".27" r="1.05">
      <stop offset="0" stop-color="#DCEBDC"/>
      <stop offset=".42" stop-color="#B4D0BC"/>
      <stop offset=".78" stop-color="#8FB49E"/>
      <stop offset="1" stop-color="#6E9481"/>
    </radialGradient>
    <radialGradient id="shd" cx=".3" cy=".25" r="1.1">
      <stop offset=".52" stop-color="#3E5A4A" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E5A4A" stop-opacity=".42"/>
    </radialGradient>
    <!-- 大陆：暖沙金 -->
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E0B8"/>
      <stop offset="1" stop-color="#D9B183"/>
    </linearGradient>
    <radialGradient id="spec" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="256" cy="242" r="154"/></clipPath>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur18" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#glow)"/>
  <rect x="22" y="22" width="468" height="468" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity=".36" stroke-width="5"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="none" stroke="#5E421E" stroke-opacity=".14" stroke-width="3"/>

  <!-- 球体投影 -->
  <ellipse cx="256" cy="418" rx="132" ry="26" fill="#5E421E" opacity=".3" filter="url(#blur18)"/>

  <!-- 海洋球体 -->
  <circle cx="256" cy="242" r="154" fill="url(#sea)"/>
  <g clip-path="url(#clip)">
    <!-- 大陆：两大块清晰陆地（左：欧亚意象；右：美洲意象）+ 小岛点缀 -->
    <g fill="url(#land)" stroke="#B98F5C" stroke-opacity=".35" stroke-width="3">
      <path d="M118 190c8-34 44-58 84-62 38-4 60 10 88 6 26-4 40-22 66-16 30 8 44 40 34 68-8 24-32 30-40 52-8 24 6 44-8 62-16 20-48 16-64-4-12-16-6-36-22-50-18-16-48-10-72-16-30-8-56-16-66-40z"/>
      <path d="M408 148c22-2 40 16 40 38 0 20-16 32-30 46-12 12-10 30-24 38-16 10-36 0-40-18-4-20 8-34 10-52 2-22 22-50 44-52z"/>
      <path d="M186 322c22-10 48-2 56 18 8 22-6 44-28 50-24 6-46-8-48-30-2-16 6-30 20-38z"/>
      <path d="M300 356c14-4 28 4 30 18 2 12-8 24-22 24-14 0-24-12-22-24 2-8 6-14 14-18z"/>
      <path d="M348 108c12-4 24 2 26 14 2 10-6 20-18 20-12 0-20-10-18-20 2-6 4-10 10-14z"/>
    </g>
    <!-- 经纬线 -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="5">
      <ellipse cx="256" cy="242" rx="66" ry="154"/>
      <path d="M102 242h308"/>
      <path d="M116 168h280M116 316h280"/>
    </g>
    <!-- 球体内阴影 -->
    <circle cx="256" cy="242" r="154" fill="url(#shd)"/>
    <!-- 斜向玻璃高光条 -->
    <path d="M92 300 208 72l60 30L150 332z" fill="#FFFFFF" opacity=".18" filter="url(#blur8)"/>
  </g>

  <!-- 主高光斑 -->
  <ellipse cx="192" cy="152" rx="62" ry="42" fill="url(#spec)" transform="rotate(-24 192 152)"/>
  <!-- 右下环境反光 -->
  <path d="M352 356a154 154 0 0 0 54-92" fill="none" stroke="#FFF3DC" stroke-opacity=".85" stroke-width="10" stroke-linecap="round" filter="url(#blur8)"/>
  <!-- 球缘描边 -->
  <circle cx="256" cy="242" r="154" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="4"/>
</svg>
